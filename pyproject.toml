[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sre-copilot"
version = "0.1.0"
description = "AI-powered incident response and root cause analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "numpy>=1.26,<2.4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
    "streamlit>=1.41,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "frontend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "chromadb", "chromadb.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
